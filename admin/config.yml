backend:
  name: github
  repo: Grandview-Resident-Technology/grandview-exchange-test
  branch: main
  base_url: https://decap-oauth-worker.leon-e4e.workers.dev
  auth_endpoint: auth

# Media & Collection settings
media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }